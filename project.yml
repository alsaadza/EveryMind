name: EducateAI
options:
  bundleIdPrefix: com.educateai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  EducateAI:
    type: application
    platform: iOS
    sources:
      - path: EducateAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.educateai.questlands
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Margin
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: EducateAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: Margin
        UIAppFonts:
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - Figtree-Bold.ttf
          - Figtree-Medium.ttf
          - Figtree-Regular.ttf
          - Figtree-SemiBold.ttf
          - Fraunces-Bold.ttf
          - Fraunces-Italic.ttf
          - Fraunces-Regular.ttf
          - Fraunces-SemiBold.ttf
          - Lexend-Medium.ttf
          - Lexend-Regular.ttf
          - Lexend-SemiBold.ttf
          - OpenDyslexic-Bold.otf
          - OpenDyslexic-Regular.otf
          - SourceSerif4-Italic.ttf
          - SourceSerif4-Regular.ttf
          - SourceSerif4-SemiBold.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Margin connects to your school's Margin gateway on the local network to reach OCI Generative AI.
        ITSAppUsesNonExemptEncryption: false
  EducateAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EducateAIUITests
    dependencies:
      - target: EducateAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.educateai.questlands.uitests
        TEST_TARGET_NAME: EducateAI
  EducateAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EducateAITests
    dependencies:
      - target: EducateAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.educateai.questlands.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EducateAI.app/EducateAI
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  EducateAI:
    build:
      targets:
        EducateAI: all
        EducateAIUITests: [test]
        EducateAITests: [test]
    test:
      targets:
        - EducateAITests
        - EducateAIUITests
